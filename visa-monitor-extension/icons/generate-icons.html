<!DOCTYPE html>
<html>
<head><title>Generate Icons</title></head>
<body>
<p>Open this file in a browser, right-click each canvas, and "Save image as" to get the PNG icons.</p>
<canvas id="c16" width="16" height="16"></canvas>
<canvas id="c48" width="48" height="48"></canvas>
<canvas id="c128" width="128" height="128"></canvas>
<script>
function drawIcon(canvas) {
  const size = canvas.width;
  const ctx = canvas.getContext('2d');
  const s = size / 128;

  // Background circle
  ctx.beginPath();
  ctx.arc(size/2, size/2, size/2 - 2*s, 0, Math.PI*2);
  ctx.fillStyle = '#1e3a5f';
  ctx.fill();

  // Star
  ctx.fillStyle = '#60a5fa';
  ctx.font = `bold ${size * 0.55}px sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('V', size/2, size/2 + 2*s);

  // Notification dot
  ctx.beginPath();
  ctx.arc(size * 0.75, size * 0.25, size * 0.15, 0, Math.PI*2);
  ctx.fillStyle = '#ef4444';
  ctx.fill();
}

drawIcon(document.getElementById('c16'));
drawIcon(document.getElementById('c48'));
drawIcon(document.getElementById('c128'));
</script>
</body>
</html>
